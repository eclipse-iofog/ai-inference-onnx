name: CodeQL

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

permissions: read-all

env:
  GO_VERSION: '1.26.10'

jobs:
  analyze:
    name: Analyze (${{ matrix.module }})
    runs-on: ubuntu-latest
    permissions:
      # Required to upload SARIF to the code-scanning dashboard.
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: engine
            source-root: .
          - module: dashboard
            source-root: dashboard

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: go
          source-root: ${{ matrix.source-root }}

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      - name: Autobuild
        uses: github/codeql-action/autobuild@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
        with:
          category: "/language:go-${{ matrix.module }}"
          # Fork pull requests get a read-only token, so the SARIF upload is
          # skipped. Analysis still runs. Uploads happen on same-repository
          # pull requests and on pushes.
          upload: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
