name: Dashboard release

# The prefix dashboard/v is removed, so dashboard/v0.2.0 becomes 0.2.0.

on:
  push:
    tags:
      - "dashboard/v*"

permissions: read-all

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Resolve the registry
        env:
          IMAGE_REGISTRY: ${{ vars.IMAGE_REGISTRY }}
          OCI_SOURCE_REPO: ${{ vars.OCI_SOURCE_REPO }}
        run: |
          set -euo pipefail
          registry="${IMAGE_REGISTRY:-}"
          source_repo="${OCI_SOURCE_REPO:-}"
          if [ -z "$registry" ] || [ -z "$source_repo" ]; then
            case "${GITHUB_REPOSITORY}" in
              eclipse-iofog/ai-inference-onnx)
                registry="${registry:-ghcr.io/eclipse-iofog}"
                source_repo="${source_repo:-https://github.com/eclipse-iofog/ai-inference-onnx}"
                ;;
              *)
                registry="${registry:-ghcr.io/datasance}"
                source_repo="${source_repo:-https://github.com/datasance/ai-inference-onnx}"
                ;;
            esac
          fi
          registry="${registry%/}"
          source_repo="${source_repo%/}"
          if [ -z "$registry" ]; then
            echo "IMAGE_REGISTRY is empty" >&2
            exit 1
          fi
          if [ -z "$source_repo" ]; then
            echo "OCI_SOURCE_REPO is empty" >&2
            exit 1
          fi
          version="${GITHUB_REF_NAME#dashboard/v}"
          if [ -z "$version" ] || [ "$version" = "$GITHUB_REF_NAME" ]; then
            echo "dashboard tag must start with dashboard/v" >&2
            exit 1
          fi
          if ! printf '%s\n' "$version" | grep -Eq '^[A-Za-z0-9_][A-Za-z0-9_.-]{0,80}$'; then
            echo "dashboard version is not an image tag" >&2
            exit 1
          fi
          {
            echo "IMAGE_REGISTRY=${registry}"
            echo "OCI_SOURCE_REPO=${source_repo}"
            echo "IMAGE=${registry}/ai-inference-dashboard"
            echo "OCI_VERSION=${version}"
          } >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push by digest
        id: push
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: dashboard
          file: build/Dockerfile.dashboard
          platforms: ${{ matrix.platform }}
          build-args: |
            OCI_SOURCE_REPO=${{ env.OCI_SOURCE_REPO }}
            OCI_VERSION=${{ env.OCI_VERSION }}
            OCI_REVISION=${{ github.sha }}
          provenance: true
          sbom: true
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Record the digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          case "$DIGEST" in
            sha256:*) ;;
            *) echo "dashboard digest is missing" >&2; exit 1 ;;
          esac
          printf '%s\n' "$DIGEST" > digest.txt

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dashboard-digest-${{ matrix.arch }}
          path: digest.txt
          if-no-files-found: error

  publish:
    name: Publish the tag
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Resolve the registry
        env:
          IMAGE_REGISTRY: ${{ vars.IMAGE_REGISTRY }}
          OCI_SOURCE_REPO: ${{ vars.OCI_SOURCE_REPO }}
        run: |
          set -euo pipefail
          registry="${IMAGE_REGISTRY:-}"
          source_repo="${OCI_SOURCE_REPO:-}"
          if [ -z "$registry" ] || [ -z "$source_repo" ]; then
            case "${GITHUB_REPOSITORY}" in
              eclipse-iofog/ai-inference-onnx)
                registry="${registry:-ghcr.io/eclipse-iofog}"
                source_repo="${source_repo:-https://github.com/eclipse-iofog/ai-inference-onnx}"
                ;;
              *)
                registry="${registry:-ghcr.io/datasance}"
                source_repo="${source_repo:-https://github.com/datasance/ai-inference-onnx}"
                ;;
            esac
          fi
          registry="${registry%/}"
          source_repo="${source_repo%/}"
          if [ -z "$registry" ]; then
            echo "IMAGE_REGISTRY is empty" >&2
            exit 1
          fi
          if [ -z "$source_repo" ]; then
            echo "OCI_SOURCE_REPO is empty" >&2
            exit 1
          fi
          version="${GITHUB_REF_NAME#dashboard/v}"
          if [ -z "$version" ] || [ "$version" = "$GITHUB_REF_NAME" ]; then
            echo "dashboard tag must start with dashboard/v" >&2
            exit 1
          fi
          if ! printf '%s\n' "$version" | grep -Eq '^[A-Za-z0-9_][A-Za-z0-9_.-]{0,80}$'; then
            echo "dashboard version is not an image tag" >&2
            exit 1
          fi
          {
            echo "IMAGE_REGISTRY=${registry}"
            echo "OCI_SOURCE_REPO=${source_repo}"
            echo "IMAGE=${registry}/ai-inference-dashboard"
            echo "OCI_VERSION=${version}"
          } >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Create the manifest and sign it
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${OCI_VERSION}" ]; then
            echo "dashboard version is empty" >&2
            exit 1
          fi
          rm -rf artifacts
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --pattern 'dashboard-digest-*' --dir artifacts
          refs=()
          for arch in amd64 arm64; do
            file="artifacts/dashboard-digest-${arch}/digest.txt"
            if [ ! -f "$file" ]; then
              echo "dashboard digest is missing for ${arch}" >&2
              exit 1
            fi
            digest=$(tr -d '[:space:]' < "$file")
            case "$digest" in
              sha256:*) ;;
              *) echo "dashboard digest is missing for ${arch}" >&2; exit 1 ;;
            esac
            refs+=("${IMAGE}@${digest}")
          done
          tag="${IMAGE}:${OCI_VERSION}"
          docker buildx imagetools create -t "$tag" "${refs[@]}"
          manifest=$(docker buildx imagetools inspect --format '{{json .}}' "$tag")
          index=$(printf '%s' "$manifest" | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          found = ""
          for key in ("Digest", "digest"):
              value = data.get(key)
              if isinstance(value, str) and value.startswith("sha256:"):
                  found = value
                  break
          if not found:
              manifest_body = data.get("Manifest") or data.get("manifest") or {}
              if isinstance(manifest_body, dict):
                  value = manifest_body.get("digest") or manifest_body.get("Digest") or ""
                  if isinstance(value, str):
                      found = value.strip("\"")
          if not found.startswith("sha256:"):
              sys.exit("manifest digest is missing")
          sys.stdout.write(found)
          ')
          cosign sign --yes "${IMAGE}@${index}"
          printf '%s@%s\n' "$tag" "$index" | tee -a "$GITHUB_STEP_SUMMARY"
