name: ONNX Runtime

on:
  workflow_dispatch:

permissions: read-all

jobs:
  sign:
    name: Sign recorded runtimes
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Resolve the registry
        env:
          IMAGE_REGISTRY: ${{ vars.IMAGE_REGISTRY }}
        run: |
          set -euo pipefail
          registry="${IMAGE_REGISTRY:-}"
          if [ -z "$registry" ]; then
            case "${GITHUB_REPOSITORY}" in
              eclipse-iofog/ai-inference-onnx)
                registry=ghcr.io/eclipse-iofog
                ;;
              *)
                registry=ghcr.io/datasance
                ;;
            esac
          fi
          registry="${registry%/}"
          if [ -z "$registry" ]; then
            echo "IMAGE_REGISTRY is empty" >&2
            exit 1
          fi
          echo "IMAGE=${registry}/ai-inference-onnx-runtime" >> "$GITHUB_ENV"

      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the recorded runtimes
        run: |
          set -euo pipefail
          lock=build/onnxruntime/runtime-images.txt
          if [ ! -f "$lock" ]; then
            echo "runtime-images.txt is missing" >&2
            exit 1
          fi
          found=0
          while IFS= read -r raw || [ -n "$raw" ]; do
            line="${raw#"${raw%%[![:space:]]*}"}"
            line="${line%"${line##*[![:space:]]}"}"
            case "$line" in
              "" | \#*) continue ;;
            esac
            variant="${line%% *}"
            rest="${line#"$variant"}"
            rest="${rest#"${rest%%[![:space:]]*}"}"
            case "$rest" in
              1.31.0-"${variant}"@sha256:*) ;;
              *)
                echo "runtime-images.txt line is malformed" >&2
                exit 1
                ;;
            esac
            digest="${rest##*@}"
            cosign sign --yes "${IMAGE}@${digest}"
            found=1
          done <"$lock"
          if [ "$found" -ne 1 ]; then
            echo "runtime-images.txt has no runtime" >&2
            exit 1
          fi
