apiVersion: datasance.com/v3        # iofog.org/v3
kind: Role
metadata:
  name: inference-user
rules:
  - apiGroups:
      - edgelet.iofog.org/v1
    resources:
      - microservices/config/self
      - auth/whoami
      - system/gps
      - microservices/control/self
    verbs:
      - get
  - apiGroups:
      - inference.iofog.org/v2
    resources:
      - models
      - server
      - repository/index
    verbs:
      - get
  - apiGroups:
      - inference.iofog.org/v2
    resources:
      - models/*/infer
    verbs:
      - create
  - apiGroups:
      - inference.iofog.org/v2
    resources:
      - models/*
    verbs:
      - get
